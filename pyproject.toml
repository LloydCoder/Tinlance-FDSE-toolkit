[build-system]
requires = ["setuptools>=75", "wheel>=0.45"]
build-backend = "setuptools.build_meta"

[project]
name = "tinlance-fdse-toolkit"
version = "0.1.0.dev0"
description = "Private Forward-Deployed Security Engineer field toolkit for Tinlance engagements"
readme = "README.md"
requires-python = ">=3.11,<4"
license = {text = "Proprietary"}
authors = [{name = "Tinlance Limited"}]
classifiers = ["Development Status :: 3 - Alpha", "Intended Audience :: Information Technology", "Programming Language :: Python :: 3.11", "Programming Language :: Python :: 3.12", "Programming Language :: Python :: 3.13", "Programming Language :: Python :: 3.14"]
dependencies = ["openpyxl>=3.1.5,<4", "python-docx>=1.2.0,<2", "reportlab>=5.0.1,<6", "scapy>=2.8.0,<3", "jsonschema>=4.26,<5", "cryptography>=46,<47"]

[project.scripts]
fdse = "fdse_toolkit.cli:main"

[dependency-groups]
test = ["pytest>=8,<9", "pytest-cov>=6,<8"]
quality = ["ruff>=0.13,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.setuptools.package-data]
fdse_toolkit = ["schemas/*.schema.json"]
