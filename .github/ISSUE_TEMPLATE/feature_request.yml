name: Feature request
description: Propose a maintainable Toolkit improvement.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What operator or customer-delivery problem does this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the smallest complete solution.
    validations:
      required: true
  - type: textarea
    id: boundaries
    attributes:
      label: Security and scope boundaries
      description: Explain authorization, data-handling or execution implications.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Define observable conditions for success.
    validations:
      required: true
