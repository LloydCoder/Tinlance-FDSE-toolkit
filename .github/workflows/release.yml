name: fdse-release
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
  attestations: write
jobs:
  package-and-provenance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install build tooling
        run: python -m pip install --upgrade pip "build>=1.3,<2"
      - name: Install project
        run: python -m pip install .
      - name: Generate SBOM
        run: |
          python - <<'PY'
          from fdse_toolkit.supply_chain import write_sbom
          write_sbom("dist/fdse-toolkit.sbom.json")
          PY
      - name: Build Python distributions
        run: python -m build --outdir dist
      - name: Record dependency snapshot
        run: python -m pip freeze | sort > dist/requirements.resolved.txt
      - name: Generate release hashes
        run: |
          cd dist
          sha256sum * > SHA256SUMS
      - name: Validate release contents
        run: |
          test -s dist/fdse-toolkit.sbom.json
          test -s dist/SHA256SUMS
          ls -1 dist/*.whl dist/*.tar.gz
          sha256sum -c dist/SHA256SUMS
      - name: Upload release evidence
        uses: actions/upload-artifact@v4
        with:
          name: fdse-release-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 30
      - name: Attest release artifacts
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz
