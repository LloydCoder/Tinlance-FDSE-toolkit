name: fdse-ci
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: fdse-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  baseline-and-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install maintained package
        run: python -m pip install .
      - name: Install quality tools
        run: python -m pip install "pytest>=8,<9" "pytest-cov>=6,<8" "hypothesis>=6,<7" "ruff>=0.13,<1"
      - name: Compile maintained Python
        run: python -m compileall -q src
      - name: CLI smoke test
        run: |
          fdse --version
          fdse --help
      - name: Validate schema documents and package mirrors
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('schemas')
          pkg = Path('src/fdse_toolkit/schemas')
          for path in sorted(root.glob('*.schema.json')):
              data = json.loads(path.read_text(encoding='utf-8'))
              assert data.get('$schema') == 'https://json-schema.org/draft/2020-12/schema', path
              assert isinstance(data.get('$id'), str) and data['$id'], path
              mirror = pkg / path.name
              assert mirror.read_bytes() == path.read_bytes(), mirror
          PY
      - name: Run tests with coverage
        run: pytest --cov=fdse_toolkit --cov-report=term-missing --cov-fail-under=70
      - name: Ruff check
        run: ruff check src tests
