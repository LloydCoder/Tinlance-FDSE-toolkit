name: fdse-forensic-recovery
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, phase0-recovery]
permissions:
  contents: write
jobs:
  recover-and-verify:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Verify recovered baseline archive
        shell: bash
        run: |
          set -euo pipefail
          test -f Tinlance-FDSE-toolkit/Tinlance_FDSE_Toolkit_v2.0.0_COMPLETE.zip
          unzip -t Tinlance-FDSE-toolkit/Tinlance_FDSE_Toolkit_v2.0.0_COMPLETE.zip >/dev/null
      - name: Recover legacy implementation on PR branch
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .fdse_extract
          mkdir .fdse_extract
          unzip -q Tinlance-FDSE-toolkit/Tinlance_FDSE_Toolkit_v2.0.0_COMPLETE.zip -d .fdse_extract
          rm -rf legacy
          mkdir -p legacy
          cp -R .fdse_extract/new_components legacy/new_components
          cp -R .fdse_extract/v1_components legacy/v1_components
          cp .fdse_extract/README.txt legacy/README.txt
          cp .fdse_extract/MANIFEST.sha256 legacy/MANIFEST.sha256
          rm -rf .fdse_extract
          python3 -m compileall -q legacy
          if git diff --quiet -- legacy; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add legacy
          git commit -m "chore: recover legacy FDSE Toolkit source"
          git push
      - name: Verify recovered source
        shell: bash
        run: |
          set -euo pipefail
          test -d legacy/new_components
          test -d legacy/v1_components
          python3 -m compileall -q legacy
          find legacy -type f | sort
