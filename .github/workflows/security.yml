name: fdse-security
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: fdse-security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  dependency-and-static-security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package
        run: python -m pip install .
      - name: Install security tools
        run: python -m pip install "pip-audit>=2.9,<3" "bandit>=1.8,<2"
      - name: Dependency audit
        run: pip-audit --strict
      - name: Bandit static security scan
        run: bandit -q -r src
